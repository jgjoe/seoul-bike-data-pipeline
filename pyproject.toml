[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-bike-pipeline"
version = "0.1.0"
description = "Seoul public bike (따릉이) rental history batch data reliability / DW pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.5"]

[project.optional-dependencies]
test = ["pytest"]
cloud = ["google-cloud-storage>=3,<4", "google-cloud-bigquery>=3.38,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seoul_bike_pipeline" = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
