name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test,cloud]'
      - run: python -m pytest -q
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install apache-airflow==3.3.2 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: python -m pip install -e '.[test,cloud]'
      - run: python -m pip check
      - run: python -m pytest -q tests/test_airflow_dag.py tests/test_airflow_control.py
